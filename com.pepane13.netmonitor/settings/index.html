<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    .section { margin-bottom: 24px; }
    .status-card { border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
    .status-card h3 { margin: 0 0 6px; font-size: 15px; }
    .status-card table { width: 100%; border-collapse: collapse; }
    .status-card td { padding: 2px 0; vertical-align: top; }
    .status-card td:first-child { color: #777; padding-right: 8px; width: 46%; }
    .bad { color: #c62828; font-weight: 600; }
    .warn { color: #e65100; }
    .ok { color: #2e7d32; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
    .toolbar select { flex: 1 1 140px; }
    .toolbar button { flex: 0 0 auto; }
    #log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.45;
           max-height: 420px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 6px; background: #fafafa; }
    .row { padding: 2px 0; border-bottom: 1px solid #eee; word-break: break-word; }
    .row .t { color: #888; }
    .lvl-error { color: #c62828; }
    .lvl-warn { color: #e65100; }
    .lvl-debug { color: #777; }
    #copybox, #reportbox { width: 100%; height: 160px; font-size: 11px; display: none; margin-top: 8px; }
    .muted { color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title" id="t-title"></h1>
    <p class="homey-subtitle" id="t-intro"></p>
  </header>

  <div class="section">
    <h2 class="homey-subtitle" id="t-status-title"></h2>
    <div id="status"></div>
  </div>

  <fieldset class="homey-form-fieldset section">
    <legend class="homey-form-legend" id="t-notif-title"></legend>
    <label class="homey-form-checkbox"><input class="homey-form-checkbox-input" type="checkbox" id="notify_internet" />
      <span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text" id="t-notify_internet"></span></label>
    <label class="homey-form-checkbox"><input class="homey-form-checkbox-input" type="checkbox" id="notify_quality" />
      <span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text" id="t-notify_quality"></span></label>
    <label class="homey-form-checkbox"><input class="homey-form-checkbox-input" type="checkbox" id="notify_box" />
      <span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text" id="t-notify_box"></span></label>
    <label class="homey-form-checkbox"><input class="homey-form-checkbox-input" type="checkbox" id="notify_deco" />
      <span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text" id="t-notify_deco"></span></label>
  </fieldset>

  <div class="section">
    <h2 class="homey-subtitle" id="t-export-title"></h2>
    <p class="muted" id="t-export-intro"></p>
    <div class="toolbar">
      <button class="homey-button-primary-small" id="download"></button>
      <button class="homey-button-secondary-small" id="show-report"></button>
    </div>
    <textarea id="reportbox" readonly></textarea>
  </div>

  <div class="section">
    <h2 class="homey-subtitle" id="t-log-title"></h2>
    <div class="homey-form-group">
      <label class="homey-form-label" for="log_level" id="t-level"></label>
      <select class="homey-form-select" id="log_level">
        <option value="error" id="t-level_error"></option>
        <option value="warn" id="t-level_warn"></option>
        <option value="info" id="t-level_info"></option>
        <option value="debug" id="t-level_debug"></option>
      </select>
    </div>
    <div class="toolbar">
      <span id="t-show" class="muted"></span>
      <select class="homey-form-select" id="filter">
        <option value="error" id="t-f-error"></option>
        <option value="warn" id="t-f-warn"></option>
        <option value="info" id="t-f-info" selected></option>
        <option value="debug" id="t-f-debug"></option>
      </select>
      <button class="homey-button-secondary-small" id="refresh"></button>
      <button class="homey-button-secondary-small" id="copy"></button>
    </div>
    <p class="muted" id="count"></p>
    <div id="log"></div>
    <textarea id="copybox" readonly></textarea>
    <p><button class="homey-button-danger-small" id="clear"></button></p>
  </div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const $ = (id) => document.getElementById(id);
      const __ = (k) => Homey.__(`settings.${k}`);
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      const fmtTime = (iso) => (iso ? new Date(iso).toLocaleString() : '—');
      const n = (v, unit = '') => (v === null || v === undefined ? '—' : `${v}${unit}`);
      const cls = (bad, warn) => (bad ? 'bad' : warn ? 'warn' : '');

      ['title', 'intro', 'status-title', 'notif-title', 'notify_internet', 'notify_quality', 'notify_box', 'notify_deco',
        'log-title', 'level', 'level_error', 'level_warn', 'level_info', 'level_debug', 'show', 'export-title', 'export-intro']
        .forEach((k) => { $(`t-${k}`).textContent = __(k.replace('-', '_')); });
      ['error', 'warn', 'info', 'debug'].forEach((l) => { $(`t-f-${l}`).textContent = __(`level_${l}`); });
      $('refresh').textContent = __('refresh');
      $('copy').textContent = __('copy');
      $('clear').textContent = __('clear');
      $('download').textContent = __('download');
      $('show-report').textContent = __('show_report');

      // Notifications and log level
      const NOTIFY_DEFAULTS = { notify_internet: true, notify_quality: false, notify_box: true, notify_deco: true };
      Object.keys(NOTIFY_DEFAULTS).forEach((key) => {
        Homey.get(key, (err, v) => { $(key).checked = (v === null || v === undefined) ? NOTIFY_DEFAULTS[key] : !!v; });
        $(key).addEventListener('change', () => Homey.set(key, $(key).checked));
      });
      Homey.get('log_level', (err, v) => { $('log_level').value = v || 'info'; });
      $('log_level').addEventListener('change', () => Homey.set('log_level', $('log_level').value, () => loadLog()));

      // Device status cards
      function rowsInternet(d) {
        const r = d.lastRound || {};
        const t = d.today || {};
        const avgMax = (x) => (x ? `${x.avg} / ${x.max} ms` : '—');
        const st = d.lastSpeedtest;
        return [
          [__('st_status'), `<span class="${cls(d.status === 'down', d.status === 'degraded')}">${esc(d.status)}</span>`],
          [__('st_last_round'), fmtTime(r.t)],
          [__('st_latency'), `${n(r.latency != null ? Math.round(r.latency * 10) / 10 : null, ' ms')} / ${n(r.jitter != null ? Math.round(r.jitter * 10) / 10 : null, ' ms')} / ${n(r.loss != null ? Math.round(r.loss) : null, ' %')}`],
          [__('st_lan'), n(r.lan != null ? Math.round(r.lan * 10) / 10 : null, ' ms')],
          [__('st_today'), `${avgMax(t.latency)} · ${avgMax(t.jitter)} · box ${avgMax(t.lan)}`],
          [__('st_outages'), `${t.outages || 0} (${t.downtimeMin || 0} min)`],
          [__('st_alerts'), d.degraded && d.degraded.length ? `<span class="warn">${esc(d.degraded.join(', '))}</span>` : __('none')],
          [__('st_speed'), st ? `${st.download} / ${st.upload} Mbit/s (${esc(st.source || '')}) — ${fmtTime(st.t)}` : '—'],
          [__('st_last_error'), d.lastError ? `${fmtTime(d.lastError.t)} — ${esc(d.lastError.text)}` : __('none')],
        ];
      }
      function rowsBox(d) {
        const st = d.lastSpeedtest;
        const q = d.quality;
        return [
          [__('st_link'), `<span class="${cls(d.online === false)}">${d.online ? __('yes') : __('no')}</span> · ${esc(d.state || '')}`],
          [__('st_quality'), `<span class="${cls(q != null && q < 50, q != null && q < 75)}">${n(q, ' %')}</span>${d.qualityParts ? ` <span class="muted">${esc(Object.entries(d.qualityParts).filter(([, v]) => v != null).map(([k, v]) => `${k} ${v}`).join(' · '))}</span>` : ''}`],
          [__('st_optical'), n(d.rxPower, ' dBm')],
          [__('st_traffic'), `${n(d.traffic && d.traffic.down, ' Mbit/s')} / ${n(d.traffic && d.traffic.up, ' Mbit/s')}${d.traffic && d.traffic.rejected ? ` <span class="muted">(${d.traffic.rejected} ${__('st_rejected')})</span>` : ''}`],
          [__('st_speed'), st ? `${st.download} / ${st.upload} Mbit/s, ${n(st.latency, ' ms')} — ${fmtTime(st.t)}` : '—'],
          [__('st_last_read'), fmtTime(d.lastStatusAt)],
          [__('st_last_error'), d.lastError ? `${fmtTime(d.lastError.t)} — ${esc(d.lastError.text)}` : __('none')],
        ];
      }
      function rowsDeco(d) {
        const l = d.latency || {};
        return [
          [__('st_status'), `<span class="${cls(d.online === false)}">${d.online ? __('yes') : __('no')}</span>`],
          [__('st_role'), `${esc(d.role)} · ${esc(d.backhaul || '')}`],
          [__('st_clients'), n(d.clients)],
          [__('st_deco_latency'), l.latency != null
            ? `${Math.round(l.latency * 10) / 10} ms · ${n(l.jitter != null ? Math.round(l.jitter * 10) / 10 : null, ' ms')} · ${Math.round(l.loss)} %`
            : esc(l.error || '—')],
          [__('st_last_read'), fmtTime(d.lastSnapshotAt)],
          [__('st_last_error'), d.lastError ? `${fmtTime(d.lastError.t)} — ${esc(d.lastError.text)}` : __('none')],
        ];
      }
      function loadStatus() {
        Homey.api('GET', '/status', null, (err, list) => {
          if (err) { $('status').textContent = err.message || String(err); return; }
          const order = { internet: 0, box: 1, deco: 2 };
          $('status').innerHTML = (list || []).slice().sort((a, b) => (order[a.kind] ?? 3) - (order[b.kind] ?? 3)).map((d) => {
            const rows = d.kind === 'internet' ? rowsInternet(d) : d.kind === 'box' ? rowsBox(d) : rowsDeco(d);
            return `<div class="status-card"><h3>${esc(d.name)} <span class="muted">${esc(d.host || '')}</span></h3><table>${
              rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table></div>`;
          }).join('') || `<p class="muted">${__('empty')}</p>`;
        });
      }

      // Log
      let lastEntries = [];
      const line = (e) => `${new Date(e.t).toLocaleString()} [${e.l.toUpperCase()}] ${e.s} (${e.c}) ${e.m}`;
      function loadLog() {
        Homey.api('GET', `/log?level=${$('filter').value}`, null, (err, entries) => {
          if (err) { $('log').textContent = err.message || String(err); return; }
          lastEntries = entries || [];
          $('count').textContent = `${lastEntries.length} ${__('entries')}`;
          $('log').innerHTML = lastEntries.length
            ? lastEntries.slice().reverse().map((e) => `<div class="row lvl-${e.l}"><span class="t">${esc(new Date(e.t).toLocaleString())}</span> `
              + `<b>${e.l.toUpperCase()}</b> ${esc(e.s)} · ${esc(e.c)} — ${esc(e.m)}</div>`).join('')
            : `<p class="muted">${__('empty')}</p>`;
        });
      }
      $('filter').addEventListener('change', loadLog);
      $('refresh').addEventListener('click', () => { loadStatus(); loadLog(); });

      $('copy').addEventListener('click', async () => {
        const text = lastEntries.map(line).join('\n');
        try {
          await navigator.clipboard.writeText(text);
          Homey.alert(__('copied'));
        } catch (e) {
          const box = $('copybox');
          box.style.display = 'block';
          box.value = text;
          box.focus();
          box.select();
          Homey.alert(__('copy_manual'));
        }
      });

      $('clear').addEventListener('click', () => {
        Homey.confirm(__('confirm_clear'), 'warning', (err, ok) => {
          if (!ok) return;
          Homey.api('DELETE', '/log', null, () => loadLog());
        });
      });

      // Diagnostic report export
      function getReport(cb) {
        Homey.api('GET', '/report', null, (err, report) => {
          if (err) { Homey.alert(err.message || String(err), 'error'); return; }
          cb(report);
        });
      }
      function showReport(report) {
        const box = $('reportbox');
        box.style.display = 'block';
        box.value = report.text;
        box.focus();
        box.select();
      }
      $('download').addEventListener('click', () => getReport((report) => {
        try {
          const blob = new Blob([report.text], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = report.filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          Homey.alert(__('report_ready'));
        } catch (e) {
          showReport(report); // download not supported (mobile app): show it for copy
          Homey.alert(__('copy_manual'));
        }
      }));
      $('show-report').addEventListener('click', () => getReport(async (report) => {
        showReport(report);
        try {
          await navigator.clipboard.writeText(report.text);
          Homey.alert(__('report_copied'));
        } catch (e) {
          Homey.alert(__('copy_manual'));
        }
      }));

      loadStatus();
      loadLog();
      Homey.ready();
    }
  </script>
</body>
</html>
